name: verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  locked-baseline:
    name: locked baseline (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "26.8.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Pin npm
        run: |
          npm install --global --ignore-scripts npm@11.19.0
          test "$(npm --version)" = "11.19.0"
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-lifecycle.mjs
      - run: npm ci
      - run: node scripts/verify-lifecycle.mjs
      - name: Record locked host versions
        run: |
          node --version
          test "$(npm --version)" = "11.19.0"
          node -p "'Pi ' + require('./node_modules/@earendil-works/pi-coding-agent/package.json').version"
          node -p "'Pi TUI ' + require('./node_modules/@earendil-works/pi-tui/package.json').version"
      - run: npm run test:verifiers
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run verify:package
      - run: node scripts/verify-lifecycle.mjs
      - run: npm run verify:actions
      - run: npm run audit:production
      - run: npm run audit:full
      - run: npm run smoke:no-dev
      - run: npm run host:load

  latest-registry-host:
    name: latest registry Pi/TUI compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.8.1"
          cache: npm
      - name: Pin npm
        run: |
          npm install --global --ignore-scripts npm@11.19.0
          test "$(npm --version)" = "11.19.0"
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-lifecycle.mjs
      - run: npm ci
      - run: node scripts/verify-lifecycle.mjs
      - name: Install and record latest registry host
        shell: bash
        run: |
          test "$(npm --version)" = "11.19.0"
          PI_VERSION="$(npm view @earendil-works/pi-coding-agent version)"
          TUI_VERSION="$(npm view @earendil-works/pi-tui version)"
          echo "registry Pi=${PI_VERSION} Pi TUI=${TUI_VERSION}"
          npm install --ignore-scripts --no-save --package-lock=false "@earendil-works/pi-coding-agent@${PI_VERSION}" "@earendil-works/pi-tui@${TUI_VERSION}"
          npm ls --all
          node --version
          test "$(npm --version)" = "11.19.0"
          node -p "'resolved Pi ' + require('./node_modules/@earendil-works/pi-coding-agent/package.json').version"
          node -p "'resolved Pi TUI ' + require('./node_modules/@earendil-works/pi-tui/package.json').version"
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run host:load
